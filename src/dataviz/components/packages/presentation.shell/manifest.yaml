schema: dataviz/component-package/v1
package: presentation.shell
version: 1.9.1
category: presentation
purpose: Stable layout, theme and semantic component-state contracts around declarative content.
implementation:
  mode: package
  sources: []
dependencies: [section.declarative]
components:
  - {id: layout.overview, purpose: General executive overview, status: stable}
  - {id: layout.monitoring, purpose: Dense operational monitoring, status: stable}
  - {id: layout.report, purpose: Long-form analytical narrative, status: stable}
  - {id: layout.exploration, purpose: Selection and table-led exploration, status: stable}
  - {id: layout.freeform, purpose: Minimal preset for custom Canvas HTML and CSS, status: stable}
  - {id: theme.plain, purpose: Minimal neutral analysis style, status: stable}
  - {id: theme.editorial, purpose: Warm report and narrative style, status: stable}
  - {id: theme.terminal, purpose: Dark technical monitoring style, status: stable}
  - {id: theme.business, purpose: Clean neutral analytical default, status: stable}
  - {id: control-panel.adaptive, purpose: Container-responsive Query grid with bounded readable tracks, trailing whitespace for sparse forms, single-column scoped Controls by default and explicit field spans, status: stable}
  - {id: report.brand, purpose: Compact Dataviz provenance mark in portable HTML without importing Server navigation or diagnostics, status: stable}
  - {id: shell.host-parity, purpose: Keep Server and portable HTML Header, controls, Query tray and base typography visually consistent, status: stable}
runtime: {controller: controller.js, adapter: adapter.js, style: style.css}
