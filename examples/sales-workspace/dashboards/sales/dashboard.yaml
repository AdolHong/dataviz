schema: dataviz/dashboard/v16
kind: dashboard
id: sales
title: 销售脉搏
description: 从原始订单到区域目标，用一张带编辑感的画布追踪经营节奏。
context:
  grain: 一行代表一个区域在某天的一组订单
  currency: CNY
  owner: analytics-studio
assumptions:
  - 所有金额均为含税人民币元
  - 预测值为历史收入乘以 1.08，仅用于演示 Dataset Transform
query_parameters:
  - id: target_factor
    type: single_input
    value_type: number
    label: 目标系数
    default: 1.0
controls:
  - id: region
    field: region
    type: multiple_select
    value_type: text
    label: 区域
    initial: {mode: values, values: [North, South, East, West]}
    options:
      mode: static
      choices:
        - {label: 北区, value: North}
        - {label: 南区, value: South}
        - {label: 东区, value: East}
        - {label: 西区, value: West}
sources:
  - sources/orders.yaml
  - sources/targets.yaml
dataset_transforms:
  - transforms/sales-metrics.yaml
views:
  - id: revenue
    title: 收入与预测轨迹
    description: Plotly 动态折线
    input: dataset:sales-metrics/trend
    template: line
    x: date
    y: [revenue, forecast_revenue]
    aggregate: sum
    control_inputs:
      region: {mode: filter, control: dashboard.region, field: region, inputs: [main], empty: match_none}
      min_revenue: {mode: filter, control: section.min_revenue, field: revenue, inputs: [main], empty: passthrough, operator: gte}

  - id: target
    title: 区域目标完成度
    description: Plotly 动态条形图
    input: dataset:sales-metrics/completion
    template: bar
    x: region
    y: completion_pct
    aggregate: none
    control_inputs:
      region: {mode: filter, control: dashboard.region, field: region, inputs: [main], empty: match_none}
      min_revenue: {mode: filter, control: section.min_revenue, field: revenue, inputs: [main], empty: passthrough, operator: gte}

  - id: distribution
    title: 订单分布
    description: Plotly 动态订单分布
    input: source:orders/main
    template: bar
    x: region
    y: orders
    aggregate: sum
    control_inputs:
      region: {mode: filter, control: dashboard.region, field: region, inputs: [main], empty: match_none}
      min_revenue: {mode: filter, control: section.min_revenue, field: revenue, inputs: [main], empty: passthrough, operator: gte}

  - id: detail
    title: 明细检查
    description: 可定制普通表格
    input: source:orders/main
    template: table
    columns: [date, region, revenue, orders]
    limit: 100
    controls:
      - id: min_orders
        field: orders
        type: single_input
        value_type: number
        label: 最低订单数
        default: 0
    control_inputs:
      region: {mode: filter, control: dashboard.region, field: region, inputs: [main], empty: match_none}
      min_orders: {mode: filter, control: view.min_orders, field: orders, inputs: [main], empty: passthrough, operator: gte}

sections:
  - id: pulse
    title: 经营脉搏
    controls:
      - id: min_revenue
        field: revenue
        type: single_input
        value_type: number
        label: 最低单期收入
        default: 0
    views: [revenue, target, distribution]
  - id: records
    title: 明细记录
    views: [detail]
layout:
  columns: 12
  gap: 18
canvas:
  template: canvas/template.html
  styles: [canvas/style.css]
  use_default_style: true
  client_libraries: [plotly]
