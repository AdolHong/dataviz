schema: dataviz/component-package/v1
package: control.range-picker
version: 3.0.0
category: data-entry
purpose: Choose an inclusive start and end date from one floating calendar interaction.
implementation: {mode: package, sources: []}
dependencies: [runtime.control]
components:
  - id: control.range-picker
    purpose: Edit one date_range value through one trigger and one coordinated popup.
    status: stable
    alignment:
      design_system: Ant Design
      component: DatePicker.RangePicker
      official: https://ant.design/components/date-picker/
      adopted: [single-popup, start-then-end, presets, min-max-bounds, allow-empty-pair, keyboard-grid]
      omitted: [time-selection, locale-package, multiple-ranges]
    logic: {type: date_range, value_shape: [start, end], fields: [min_date, max_date, allow_empty]}
    presentation: {component: range-picker, options: [start_label, end_label, presets, clear_label, css_class]}
    behavior: {inclusive: true, commit: second-date-or-preset, responsive_months: [one, two], order_validation: true}
    semantic_dom: [.dv-date-range, .dv-date-range__trigger, .dv-date-range__panel, .dv-date-range__calendars, .dv-date-range__day]
    tokens: [--dv-accent, --dv-ink, --dv-line, --dv-panel, --dv-overlay-surface, --dv-shadow-float]
runtime: {controller: controller.js, adapter: adapter.js, style: style.css}
