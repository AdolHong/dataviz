schema: dataviz/component-package/v1
package: selector.tree-select
version: 1.0.0
category: selector
purpose: Search, expand and multi-select leaves in a hierarchy without losing parent context.
dependencies: [selector.cascader]
components:
  - id: selector.tree-select
    purpose: Use one expandable tree when a cascader's side-by-side columns would be too wide.
    status: stable
    logic: {type: multi_select, fields: [path_fields], value_shape: [[level-1, level-2, leaf]]}
    presentation: {template: tree-select, options: [level_labels, placeholder, search_placeholder, path_separator, default_expand_depth, hierarchy_selection, checked_strategy, max_visible_tags, css_class]}
    behavior: {selection: leaves, parent_context: persistent, search: full-path, branch_selection: optional_descendant_toggle, checked_summary: [child, parent, all]}
    semantic_dom: [.dv-tree-select, .dv-tree-panel, .dv-tree-list, .dv-tree-option]
    tokens: [--dv-accent, --dv-green, --dv-ink, --dv-line, --dv-panel]
runtime: {controller: controller.js, adapter: adapter.js, style: style.css}
