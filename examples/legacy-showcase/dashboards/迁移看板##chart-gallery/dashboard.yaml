schema: dataviz/dashboard/v1
kind: dashboard
id: chart-gallery
title: 多图表陈列室
description: 把旧版 Plotly、Pyecharts、Matplotlib、Altair 混合 Demo 收束为浏览器端 Plotly 与 ECharts 图形语法。
adapters: {warehouse: demo-duckdb}
dashboard_selections:
  - id: province
    type: multi_select
    label: 省份
    default: [广东, 湖南, 福建, 浙江]
    choices:
      - {label: 广东, value: 广东}
      - {label: 湖南, value: 湖南}
      - {label: 福建, value: 福建}
      - {label: 浙江, value: 浙江}
sections:
  - {id: overview, title: 图形总览, views: [trend, ranking, composition]}
  - {id: details, title: 数据关系, views: [scatter, radial, records]}
sources: [sources/metrics.yaml]
widgets:
  - widgets/trend/widget.yaml
  - widgets/ranking/widget.yaml
  - widgets/composition/widget.yaml
  - widgets/scatter/widget.yaml
  - widgets/radial/widget.yaml
  - widgets/records/widget.yaml
canvas:
  template: canvas/template.html
  style: canvas/style.css
  script: canvas/script.js
  use_default_style: true
  client_selections: true
  client_sources: [metrics]
  client_libraries: [plotly, echarts]
