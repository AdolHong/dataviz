name: Quality, browser and distributions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-contracts:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Install without editable .pth
        run: uv sync --python ${{ matrix.python }} --extra dev --no-editable
      - name: Verify installed dependency graph
        run: uv pip check --python .venv/bin/python
      - name: Verify installed CLI and generated contracts
        run: |
          uv run --no-editable dataviz --help
          uv run --no-editable dataviz version
          uv run --no-editable dataviz schemas dashboard --format json
          uv run --no-editable dataviz components check --format json
      - name: Static correctness checks
        if: matrix.python == '3.12'
        run: |
          uv run --no-editable ruff check src tests scripts
          uv run --no-editable python -m compileall -q src tests scripts
          git diff --check
      - name: Unit and contract tests
        run: uv run --no-editable pytest -m "not e2e"
      - name: Verify tests did not write into repository fixtures
        if: matrix.python == '3.12'
        run: |
          uv run --no-project python scripts/check_repository_clean.py
          git diff --exit-code

  macos-noneditable:
    name: macOS non-editable install
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --python 3.12 --extra dev --no-editable
      - run: uv pip check --python .venv/bin/python
      - name: Repeated CLI imports and contracts
        run: |
          uv run --no-editable dataviz --help
          uv run --no-editable dataviz version
          uv run --no-editable dataviz components check --format json
          uv run --no-editable pytest -m "not e2e"
          uv run --no-project python scripts/check_repository_clean.py
          git diff --exit-code

  javascript-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          find src/dataviz -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check

  browsers:
    name: Browser ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --python 3.12 --extra dev --no-editable
      - run: uv pip check --python .venv/bin/python
      # CLI analysis/render checks own a Chromium session regardless of the UI matrix.
      - run: uv run --no-editable playwright install --with-deps chromium ${{ matrix.browser }}
      - uses: actions/cache@v4
        with:
          path: .browser-test-assets
          key: browser-assets-${{ hashFiles('tests/e2e/assets.json') }}
      - name: Run verified browser suite
        run: >-
          uv run --no-editable python scripts/test_browsers.py --fetch-assets
          --browsers ${{ matrix.browser }}
          --output-dir "${{ runner.temp }}/browser-evidence"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence-${{ matrix.browser }}
          path: ${{ runner.temp }}/browser-evidence
          retention-days: 7
          if-no-files-found: warn

  distributions:
    needs: [python-contracts, macos-noneditable, javascript-syntax, browsers]
    name: wheel, sdist and pip ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - name: Build all formats
        run: |
          mkdir -p "$RUNNER_TEMP/dataviz-dist"
          uv build --out-dir "$RUNNER_TEMP/dataviz-dist"
          uv run --python 3.12 --no-project python scripts/build_release_zip.py \
            --output-dir "$RUNNER_TEMP/dataviz-dist"
      - name: Clean-install and smoke-test each format
        shell: bash
        run: |
          set -euo pipefail
          artifacts=("$RUNNER_TEMP"/dataviz-dist/*.whl "$RUNNER_TEMP"/dataviz-dist/*.tar.gz "$RUNNER_TEMP"/dataviz-dist/ai-dataviz-*.zip)
          index=0
          for artifact in "${artifacts[@]}"; do
            index=$((index + 1))
            environment="$RUNNER_TEMP/package-$index"
            workspace="$RUNNER_TEMP/workspace-$index"
            uv venv "$environment" --python 3.12
            uv pip install --python "$environment/bin/python" "$artifact"
            "$environment/bin/dataviz" version
            "$environment/bin/python" -c "from importlib.resources import files; p = files('dataviz').joinpath('skills/dataviz/SKILL.md'); assert 'name: dataviz' in p.read_text(encoding='utf-8')"
            "$environment/bin/dataviz" schemas dashboard --format json
            "$environment/bin/dataviz" components check --format json
            "$environment/bin/dataviz" init "$workspace"
            "$environment/bin/dataviz" validate "$workspace"
            "$environment/bin/dataviz" report "$workspace" hello --output "$workspace/report.html"
            test -s "$workspace/report.html"
          done
      - name: Bind artifacts to successful quality gates
        env:
          QUALITY_GATES: ${{ toJSON(needs) }}
          SOURCE_REVISION: ${{ github.sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run --python 3.12 --no-project python scripts/release_evidence.py \
            --directory "$RUNNER_TEMP/dataviz-dist" \
            --revision "$SOURCE_REVISION" --run-url "$CI_RUN_URL" --gates "$QUALITY_GATES"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-dataviz-distributions
          path: |
            ${{ runner.temp }}/dataviz-dist/*.whl
            ${{ runner.temp }}/dataviz-dist/*.tar.gz
            ${{ runner.temp }}/dataviz-dist/*.zip
            ${{ runner.temp }}/dataviz-dist/*.sha256
            ${{ runner.temp }}/dataviz-dist/release-evidence.json
