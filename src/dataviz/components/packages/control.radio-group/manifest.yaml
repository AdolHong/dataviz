schema: dataviz/component-package/v1
package: control.radio-group
version: 3.0.0
category: data-entry
purpose: Choose exactly one visible option from a small, mutually exclusive set.
implementation: {mode: package, sources: []}
dependencies: [runtime.control]
components:
  - id: control.radio-group
    purpose: Keep a small single-select choice set visible without inventing All or Clear values.
    status: stable
    alignment:
      design_system: Ant Design
      component: Radio.Group
      official: https://ant.design/components/radio/
      adopted: [mutually-exclusive-value, radio-group-role, button-option-type, roving-keyboard-focus]
      omitted: [React-context, Form.Item-integration]
    logic: {type: single_select, value_types: [text, integer, number, boolean, date], fields: [choices], value_shape: scalar}
    presentation: {component: radio-group, options: [option_type, button_style, show_unavailable, css_class]}
    behavior: {cardinality: at_most_one_until_first_choice, synthetic_options: false, bulk_actions: false}
    semantic_dom: [.dv-radio-group, .dv-radio-group__option]
    tokens: [--dv-accent, --dv-ink, --dv-line, --dv-panel]
runtime: {controller: controller.js, adapter: adapter.js, style: style.css}
