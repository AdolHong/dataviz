schema: dataviz/dashboard/v1
kind: dashboard
id: progressive
title: Progressive branch check
description: The fast View must render while the slow View is still waiting.
sources:
  - sources/fast.yaml
  - sources/slow.yaml
views:
  - id: fast-view
    title: Fast branch
    template: table
    input: fast
    columns: [branch, value]
  - id: slow-view
    title: Slow branch
    template: table
    input: slow
    columns: [branch, value]
sections:
  - id: branches
    title: Independent branches
    template: comparison
    views: [fast-view, slow-view]

