schema: dataviz/component-package/v1
package: renderer.custom
version: 1.6.0
category: renderer
purpose: Trusted custom View Renderer lifecycle, isolation and contract testing.
implementation: {mode: package, sources: []}
dependencies: [view.declarative]
components:
  - id: renderer.custom
    purpose: Register one custom View Renderer without replacing the Canvas Runtime.
    status: stable
    logic:
      registration: window.datavizRuntime.registerRenderer(id, lifecycle)
      lifecycle: [validate, mount, update, dispose]
    behavior:
      failure_scope: view
      async_lifecycle: supported
      structured_error: true
      chart_service: context.charts.plotly
      table_service: context.tables.tanstack
      asset_service: context.assets
      grammar: Plotly data layout and config
      platform_matrix: [mount, update, empty, restore, interaction, resize, dispose, export]
runtime: {controller: controller.js, adapter: adapter.js, style: style.css}
