schema: dataviz/dashboard/v1
kind: dashboard
id: sales
title: 销售脉搏
description: 从原始订单到区域目标，用一张带编辑感的画布追踪经营节奏。
context:
  grain: 一行代表一个区域在某天的一组订单
  currency: CNY
  owner: analytics-studio
assumptions:
  - 所有金额均为含税人民币元
  - 预测值为历史收入乘以 1.08，仅用于演示 Server Transform
query_parameters:
  - id: target_factor
    type: number
    label: 目标系数
    default: 1.0
dashboard_selections:
  - id: region
    field: region
    type: multi_select
    label: 区域
    default: [North, South, East, West]
    choices:
      - {label: 北区, value: North}
      - {label: 南区, value: South}
      - {label: 东区, value: East}
      - {label: 西区, value: West}
sources:
  - sources/orders.yaml
  - sources/targets.yaml
server_transforms:
  - transforms/sales-metrics.yaml
views:
  - id: revenue
    title: 收入与预测轨迹
    description: Plotly 动态折线
    input: transform:sales-metrics/trend
    template: line
    x: date
    y: [revenue, forecast_revenue]
    aggregate: sum
    selection_bindings:
      min_revenue: {field: revenue, operator: gte}

  - id: target
    title: 区域目标完成度
    description: ECharts 动态条形图
    input: transform:sales-metrics/completion
    template: bar
    engine: echarts
    x: region
    y: completion_pct
    aggregate: none
    selection_bindings:
      min_revenue: {field: revenue, operator: gte}

  - id: distribution
    title: 订单分布
    description: ECharts 动态订单分布
    input: orders
    template: bar
    engine: echarts
    x: region
    y: orders
    aggregate: sum
    selection_bindings:
      min_revenue: {field: revenue, operator: gte}

  - id: detail
    title: 明细检查
    description: 可定制普通表格
    input: orders
    template: table
    columns: [date, region, revenue, orders]
    limit: 100
    selections:
      - id: min_orders
        field: orders
        type: number
        label: 最低订单数
        default: 0
    selection_bindings:
      min_orders: {field: orders, operator: gte}

sections:
  - id: pulse
    title: 经营脉搏
    selections:
      - id: min_revenue
        field: revenue
        type: number
        label: 最低单期收入
        default: 0
    views: [revenue, target, distribution]
  - id: records
    title: 明细记录
    views: [detail]
layout:
  columns: 12
  gap: 18
canvas:
  template: canvas/template.html
  style: canvas/style.css
  use_default_style: true
  client_libraries: [plotly, echarts]
