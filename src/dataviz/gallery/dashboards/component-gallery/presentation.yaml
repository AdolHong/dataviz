schema: dataviz/presentation/v1
kind: presentation
dashboard: component-gallery

theme:
  preset: business
  density: comfortable

layout:
  template: exploration
  columns: 12
  gap: 16

control_components:
  dashboard:component-gallery/region:
    component: checkbox-group
  dashboard:component-gallery/analyst-note:
    component: input
    show_count: true
  dashboard:component-gallery/scenario-name:
    component: auto-complete
    search_placeholder: Search scenarios…
  dashboard:component-gallery/sample-size:
    component: input-number
  dashboard:component-gallery/include-returns:
    component: checkbox
  dashboard:component-gallery/live-preview:
    component: switch
    checked_label: Live
    unchecked_label: Paused
  dashboard:component-gallery/as-of-date:
    component: date-picker
  dashboard:component-gallery/confidence:
    component: slider
    show_input: true
    marks:
      - {value: 0, label: "0"}
      - {value: 0.5, label: "0.5"}
      - {value: 1, label: "1"}
  section:trends/category:
    component: checkbox-group
  view:detail-table/product:
    component: select
    search: always
    search_placeholder: Search product names…
  view:detail-table/category-focus:
    component: radio-group
    option_type: button
    button_style: solid
  view:detail-table/location:
    component: cascader
    level_labels: [Province, City, District]
    search_placeholder: Search a complete path…
    selection_strategy: cascade
    show_checked_strategy: parent
  view:detail-table/location-tree:
    component: tree-select
    level_labels: [Province, City, District]
    search_placeholder: Search the location tree…
    selection_strategy: cascade
    show_checked_strategy: parent
  view:detail-table/date-window:
    component: range-picker
    start_label: From
    end_label: Through
    presets:
      - {label: Q1 2026, start: "2026-01-01", end: "2026-03-31"}
      - {label: February, start: "2026-02-01", end: "2026-02-28"}
  view:detail-table/store-virtual:
    component: select
    virtual: always
    search: always
    search_placeholder: Search a large store list…
    viewport_height: 228
  section:selected-stores/stores:
    component: select
    search: always
    search_placeholder: Search stores…

control_panels:
  dashboard:
    template: grid
    width: wide
    columns: 2
    density: compact

views:
  revenue-line: {span: 7, min_height: 380, container: chart}
  category-bars: {span: 5, min_height: 380, container: chart}
  stacked-orders: {span: 7, min_height: 360, container: chart}
  category-share: {span: 5, min_height: 360, container: chart}
  revenue-scatter: {span: 6, min_height: 360, container: chart}
  revenue-heatmap: {span: 6, min_height: 360, container: chart}
  store-radar: {span: 12, min_height: 420, container: chart}
  detail-table: {span: 6, min_height: 520, container: table}
  pivot-table: {span: 6, min_height: 520, container: table}
  narrative: {span: 4, min_height: 300, container: plain}
  image-specimen: {span: 4, min_height: 300, container: plain}
  custom-specimen: {span: 4, min_height: 300, container: elevated}
