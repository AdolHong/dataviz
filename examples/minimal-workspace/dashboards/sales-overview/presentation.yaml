schema: dataviz/presentation/v1
kind: presentation
dashboard: sales-overview

theme:
  preset: business
  accent: "#d5532d"
  density: compact

layout:
  template: overview
  columns: 12
  gap: 18

sections:
  pulse:
    template: band
    css_class: presentation-kpi-band
  trend:
    template: split
  detail:
    template: comparison

views:
  revenue-trend:
    span: 8
    min_height: 420
    container: chart
  region-comparison:
    span: 4
    min_height: 420
    container: chart
  sales-detail:
    span: 6
    container: table
    css_class: presentation-detail-table
  sales-perspective:
    span: 6
    container: table

assets:
  css:
    - assets/presentation.css
