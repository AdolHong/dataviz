schema: dataviz/dashboard/v16
kind: dashboard
id: source-lab
title: 数据源实验室
description: 同一张画布检查 SQL 与 Python 取数结果，并把执行证据组织成可阅读的数据叙事。
context:
  grain: 每个日期或业务实体一行，具体字段由对应 Source Output 定义
adapters:
  warehouse: demo-duckdb
controls:
  - id: day
    field: day
    type: multiple_select
    value_type: text
    label: 日期
    initial:
      mode: values
      values:
        - '2025-10-01'
        - '2025-10-02'
        - '2025-10-03'
        - '2025-10-04'
        - '2025-10-05'
    options:
      mode: static
      choices:
        - label: 10月1日
          value: '2025-10-01'
        - label: 10月2日
          value: '2025-10-02'
        - label: 10月3日
          value: '2025-10-03'
        - label: 10月4日
          value: '2025-10-04'
        - label: 10月5日
          value: '2025-10-05'
sources:
  - sources/sql-grid.yaml
  - sources/forecast.yaml
views:
  - id: forecast-line
    title: 客流预测轨迹
    input: source:forecast/main
    template: line
    x: timestamp
    y: [actual, forecast]
    aggregate: none
    control_inputs:
      day: {mode: filter, control: dashboard.day, field: day, inputs: [main], empty: match_none}

  - id: accuracy
    title: 日均绝对误差
    input: source:forecast/main
    template: bar
    x: day
    y: error
    aggregate: mean
    control_inputs:
      day: {mode: filter, control: dashboard.day, field: day, inputs: [main], empty: match_none}

  - id: sql-matrix
    title: DuckDB 查询明细
    input: source:sql-grid/main
    template: table
    columns: [id, val, val2, val3, val4]
    limit: 30
    control_inputs:
      day: {mode: filter, control: dashboard.day, field: day, inputs: [main], empty: match_none}

sections:
  - {id: pulse, title: 预测脉冲, views: [forecast-line, accuracy]}
  - {id: matrix, title: SQL 数据矩阵, views: [sql-matrix]}
canvas:
  template: canvas/template.html
  styles: [canvas/style.css]
  use_default_style: true
  client_libraries: [plotly]
