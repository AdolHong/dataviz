schema: dataviz/interactive-transform/v4
kind: interactive_transform
id: latest-metrics
name: 最新季度指标
description: 在浏览器中选取最新季度，避免为了轻量展示计算重新查询。
code: latest_metrics.js
entrypoint: transform
runtime: browser-js
inputs:
  metrics: source:metrics/main
query_inputs: {}
control_inputs:
  city_count: dashboard:chart-gallery/radar_city_count
  province:
    mode: filter
    control: dashboard:chart-gallery/province
    field: province
    inputs: [metrics]
    empty: match_none
trigger: auto
export: {mode: interactive}
outputs:
  main:
    kind: table
    semantics: {visibility: public, title: 当前筛选经营指标, purpose: 返回当前省份选择下用于图表联动的经营指标。, grain: 每行代表一个城市的一个季度。, caveats: [受当前省份 Control 影响。], assurance: {status: reviewed, owner: analytics, reviewed_at: 2026-08-28, evidence: [evidence/analysis-contract.md]}}
