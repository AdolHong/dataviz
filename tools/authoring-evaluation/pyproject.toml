[project]
name = "dataviz-authoring-eval"
version = "0.12.0"
description = "Repository-only paired AI authoring evaluation for ai-dataviz maintainers"
requires-python = ">=3.11,<3.15"
dependencies = ["ai-dataviz", "typer>=0.15", "pydantic>=2.10"]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
dataviz-authoring-eval = "dataviz_authoring_eval.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
ai-dataviz = { path = "../..", editable = true }
