schema: dataviz/component-test/v1
tests:
  - id: selector.date-range.contract
    component: selector.date-range
    kind: contract
    assertions: [two-labeled-inputs, canonical-comma-value, end-not-before-start, bubbling-change]
  - id: selector.date-range.presets-and-open-range
    component: selector.date-range
    kind: browser
    assertions: [preset-commits-both-bounds, clear-restores-all-dates, open-bound-only-when-enabled]
