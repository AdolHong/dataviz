schema: dataviz/dashboard/v13
kind: dashboard
id: store-performance
title: 百店业绩巡检
subtitle: 一份 Dataset，两种重复视图阅读方式
description: 全量 Small Multiples 用于巡检；Selection Gallery 用于搜索并聚焦少量门店。

layout: {template: exploration, columns: 12, gap: 18}

adapters:
  warehouse: demo-duckdb

sources:
  - id: store-sales
    name: 100 家门店的周度业绩
    type: sql
    adapter: warehouse
    code: sources/store-sales.sql
    outputs: {main: {kind: table}}

views:
  - id: all-store-trend
    title: 门店周度收入
    input: source:store-sales/main
    template: line
    x: week
    y: revenue
    aggregate: sum
    options:
      legend: {show: false}

  - id: selected-store-trend
    title: 选中门店周度收入
    input: source:store-sales/main
    template: line
    x: week
    y: revenue
    aggregate: sum
    options:
      legend: {show: false}

sections:
  - id: selected-stores
    title: 聚焦门店
    description: 支持搜索和区域 → 城市 → 门店级联多选；空选择时不创建图表。
    template: selection-gallery
    columns: 2
    controls:
      - id: stores
        label: 选择门店
        type: multiple_select
        value_type: text
        field: store_id
        path_fields: [region, city, store_id]
        placeholder: 搜索或选择门店
        initial: {mode: empty}
        options: {mode: infer}
    views: [selected-store-trend]
    repeat:
      view: selected-store-trend
      by: [store_id]
      control: stores
      title: "{store_name} · {city}"
      render: lazy

  - id: all-stores
    title: 全部门店
    description: 100 个 View 实例共享一个 Source；只在接近视口时创建 Plotly 图表。
    template: small-multiples
    columns: 2
    views: [all-store-trend]
    repeat:
      view: all-store-trend
      by: [store_id]
      title: "{store_name} · {city}"
      order_by: revenue
      order: desc
      limit: 100
      render: lazy
