schema: dataviz/dashboard/v20
kind: dashboard
id: map-lab
title: 地理下钻分析
description: 从全国门店总览原子更新城市与门店，再在城市地图中继续比较门店。
context:
  grain: 门店点位或行政片区一行
assets: [demo-regions]
controls:
  - id: city
    field: city
    type: single_select
    value_type: text
    label: 城市
    initial: {mode: value, value: 深圳}
    options:
      mode: static
      choices:
        - {label: 深圳, value: 深圳}
        - {label: 广州, value: 广州}
        - {label: 厦门, value: 厦门}
        - {label: 长沙, value: 长沙}
  - id: store
    field: store_nbr
    type: single_select
    value_type: text
    label: 门店
    initial: {mode: empty}
    clearable: true
    depends_on: [dashboard.city]
    options: {mode: infer, source: source:stores/main}
sources: [sources/stores.yaml, sources/regions.yaml]
views:
  - id: store-points
    title: 全国门店总览
    description: 点击门店会以一个原子动作同时更新 City 与 Store；总览始终保留全国上下文。
    template: map
    mark: point
    input: source:stores/main
    longitude: longitude
    latitude: latitude
    label: store_name
    color: revenue
    size: revenue
    control_binding:
      control: dashboard.store
      field: store_nbr
      writes:
        - {control: dashboard.city, field: city}
    options:
      layout:
        geo: {fitbounds: locations, projection: {type: mercator}}
  - id: city-stores
    title: 城市门店
    description: 只展示当前城市；点击另一家门店只更新 Store，高亮和明细随之切换。
    template: map
    mark: point
    input: source:stores/main
    longitude: longitude
    latitude: latitude
    label: store_name
    color: revenue
    size: revenue
    control_binding: {control: dashboard.store, field: store_nbr}
    control_inputs:
      city: &city_filter
        mode: filter
        control: dashboard.city
        field: city
        inputs: [main]
        empty: match_none
    options:
      layout:
        geo: {fitbounds: locations, projection: {type: mercator}}
  - id: region-revenue
    title: 片区收入与门店
    description: 同一 Plotly Map 生命周期组合 GeoJSON 区域与门店点位。
    template: map
    layers:
      - id: regions
        input: source:regions/main
        mark: region
        geojson: demo-regions
        data_key: region_code
        feature_key: properties.code
        color: revenue
        label: region_name
      - id: stores
        input: source:stores/main
        mark: point
        longitude: longitude
        latitude: latitude
        label: store_name
        color: revenue
        size: revenue
        control_binding: {control: dashboard.store, field: store_nbr}
  - id: region-table
    title: 当前城市门店明细
    template: table
    input: source:stores/main
    columns: [city, store_nbr, store_name, revenue]
    control_inputs:
      city: *city_filter
      store:
        mode: filter
        control: dashboard.store
        field: store_nbr
        inputs: [main]
        empty: passthrough
sections:
  - id: maps
    title: Overview → Detail
    template: comparison
    views: [store-points, city-stores]
  - id: details
    title: 数据证据与区域能力
    template: comparison
    views: [region-table, region-revenue]
