schema: dataviz/dashboard/v7
kind: dashboard
id: parameter-playground
title: 参数试验场
description: Query Parameter 决定重新取数；Selection-kind Control 只改变已经拿到的数据样本。
adapters: {warehouse: demo-duckdb}
query_parameters:
  - {id: multiplier, type: number, label: 数值倍率, default: 2}
  - {id: row_count, type: number, label: 行数, default: 12}
controls:
  - id: segment
    kind: selection
    field: segment
    type: multi_select
    label: 分组
    default: [Alpha, Beta, Gamma]
    options:
      mode: static
      choices:
        - {label: Alpha, value: Alpha}
        - {label: Beta, value: Beta}
        - {label: Gamma, value: Gamma}
sources: [sources/parameterized.yaml]
views:
  - id: parameter-line
    title: 参数生成曲线
    input: source:parameterized/main
    template: line
    x: id
    y: value
    series: segment
    aggregate: none

  - id: parameter-table
    title: 当前数据集快照
    input: source:parameterized/main
    template: table
    columns: [id, segment, value, score]
    limit: 100

sections:
  - {id: experiment, title: 参数实验, views: [parameter-line, parameter-table]}
canvas:
  template: canvas/template.html
  styles: [canvas/style.css]
  use_default_style: true
  client_libraries: [plotly]
