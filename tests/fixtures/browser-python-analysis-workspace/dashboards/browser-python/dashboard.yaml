schema: dataviz/dashboard/v9
kind: dashboard
id: browser-python
title: Browser Python
context: {grain: one row per sample}
query_parameters:
  - {id: batch, type: single_input, value_type: integer, label: Batch, default: 3}
controls:
  - {id: factor, kind: compute, label: Factor, type: single_input, value_type: number, default: 2}
sources:
  - id: raw
    name: Raw samples
    description: Browser Python input samples.
    type: file
    path: data/rows.csv
    outputs: {main: {kind: table, description: Raw sample rows}}
interactive_transforms: [transforms/scaled.yaml]
views:
  - {id: scaled, title: Scaled, template: table, input: interactive:scaled/main}
sections:
  - {id: result, title: Result, views: [scaled]}
