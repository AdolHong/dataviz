schema: dataviz/component-package/v1
package: control.input
version: 1.0.0
category: data-entry
purpose: Enter free-form text without turning suggestions into a closed choice set.
implementation: {mode: package, sources: []}
dependencies: [runtime.control]
components:
  - id: control.input
    purpose: Edit one string value as a single-line Input or multiline TextArea.
    status: stable
    alignment:
      design_system: Ant Design
      component: Input / Input.TextArea
      official: https://ant.design/components/input/
      adopted: [prefix, suffix, max-length, character-count, textarea-auto-size]
      omitted: [password, OTP, search-button, addon-layout]
    logic: {type: string, fields: [placeholder, max_length]}
    presentation: {component: input, options: [multiline, min_rows, max_rows, show_count, prefix, suffix, css_class]}
    semantic_dom: [.dv-input, .dv-input__control, .dv-input__count]
    tokens: [--dv-accent, --dv-ink, --dv-line, --dv-panel]
runtime: {controller: controller.js, adapter: adapter.js, style: style.css}
