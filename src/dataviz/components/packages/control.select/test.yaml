schema: dataviz/component-test/v1
tests:
  - id: control.select.keyboard-and-search
    component: control.select
    kind: browser
    assertions: [searches every available option, grouped choices expose headings and searchable metadata, arrow keys move the active option, enter commits canonical state, select all preserves every selected option, invert clears the current result set, escape returns focus]
  - id: control.select.virtual-dom-bound
    component: control.select
    kind: browser
    assertions: [one thousand options keep a bounded row DOM, search still covers the complete option set, fixed virtual rows expose complete labels through a native tooltip]
  - id: control.select.long-label-readability
    component: control.select
    kind: browser
    assertions: [the popup remains inside the viewport, paged and non-virtual option labels wrap to full text, remote pages do not use fixed-row virtualization]
  - id: control.select.dynamic-reconcile
    component: control.select
    kind: browser
    assertions: [normal upstream changes reconcile invalid draft values, committed snapshot values missing from the latest domain remain visible and unavailable]
