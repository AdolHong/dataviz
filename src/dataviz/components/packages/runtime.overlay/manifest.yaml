schema: dataviz/component-package/v1
package: runtime.overlay
version: 1.2.0
category: runtime
purpose: One overlay controller for popovers, Data Entry panels and future floating components.
implementation: {mode: package, sources: []}
dependencies: []
components:
  - id: runtime.overlay
    purpose: Coordinate positioning, focus return, Escape and outside-click dismissal.
    status: stable
    behavior:
      exclusivity: One open overlay per group
      dismiss: [outside-pointer, escape, explicit]
      placement: visual-viewport-aware top layer with containing-block fallback
      stacking: Floating panels stay above sibling controls
      activation: positioned before first visible frame
      focus_return: trigger
runtime:
  controller: controller.js
  adapter: adapter.js
  style: style.css
