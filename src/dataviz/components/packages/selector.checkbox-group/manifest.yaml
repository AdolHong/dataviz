schema: dataviz/component-package/v1
package: selector.checkbox-group
version: 1.1.0
category: selector
purpose: Visible multi-selection for a small set, with checkbox and checkable-tag presentations.
dependencies: [runtime.selector]
components:
  - id: selector.checkbox-group
    purpose: Select up to eight peer values without opening an overlay.
    status: stable
    logic: {type: multi_select, fields: [choices]}
    presentation: {template: checkbox-group, options: [variant, select_all_label, invert_label, max_selected, show_unavailable, css_class]}
    behavior: {variants: [default, tags], empty_selection: no_include_constraint, explicit_all: preserved, bulk_action: select_all_then_invert}
    semantic_dom: [.dv-checkbox-group, .dv-checkbox-group__toolbar, .dv-checkbox-group__action, .dv-checkbox-option]
    tokens: [--dv-accent, --dv-green, --dv-ink, --dv-line, --dv-panel]
runtime: {controller: controller.js, adapter: adapter.js, style: style.css}
