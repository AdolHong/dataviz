schema: dataviz/component-test/v1
tests:
  - id: selector.tree-select.navigation
    component: selector.tree-select
    kind: accessibility
    assertions: [tree-role, expandable-branches, leaf-selection, full-path-search, arrow-navigation]
  - id: selector.tree-select.parent-descendants
    component: selector.tree-select
    kind: browser
    assertions: [cascade-mode-selects-descendant-leaves, parent-exposes-mixed-state, checked-summary-strategy, multiple-branches-remain-selectable]
