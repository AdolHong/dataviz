[project]
name = "workspace-dataviz"
version = "0.1.0"
description = "Workspace-first data dashboards for humans and AI"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "duckdb>=1.3",
  "fastapi>=0.116",
  "jinja2>=3.1",
  "kaleido>=1.0",
  "markdown>=3.7",
  "matplotlib>=3.9",
  "packaging>=24",
  "pandas>=2.2",
  "plotly>=6.1",
  "pymysql>=1.1",
  "pyarrow>=18",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "typer>=0.15",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = ["httpx>=0.28", "playwright>=1.55", "pytest>=8.3"]

[project.scripts]
dataviz = "dataviz.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataviz = ["server/static/*", "server/templates/*", "gallery/**/*", "components/packages/**/*"]

[tool.setuptools.exclude-package-data]
dataviz = [
  "gallery/.dataviz/*",
  "gallery/.dataviz/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = ["e2e: real-browser runtime tests"]
