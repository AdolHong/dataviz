[project]
name = "ai-dataviz"
version = "0.20.1"
description = "Workspace-first data dashboards for humans and AI"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "duckdb>=1.3",
  "fastapi>=0.116",
  "jinja2>=3.1",
  "packaging>=24",
  "pandas>=2.2",
  "pymysql>=1.1",
  "pyarrow>=18",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "ruamel-yaml>=0.18.10",
  "sqlalchemy>=2.0",
  "typer>=0.15",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1", "xlrd>=2.0"]
visual-check = ["playwright>=1.55"]
dev = ["httpx>=0.28", "playwright>=1.55", "psutil>=6.1", "pytest>=8.3", "ruff>=0.12"]

[project.scripts]
dataviz = "dataviz.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataviz = ["server/static/*", "server/runtime_src/*", "server/templates/*", "vendor/plotly/*", "vendor/tanstack-table/*", "gallery/**/*", "components/packages/**/*"]

[tool.setuptools.exclude-package-data]
dataviz = [
  "gallery/.dataviz/*",
  "gallery/.dataviz/**/*",
  "gallery/**/adapters.local.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = ["e2e: real-browser runtime tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "B"]
ignore = ["B008"] # Typer declares CLI metadata through function defaults by design.
