schema: dataviz/interactive-transform/v2
kind: interactive_transform
id: scaled
name: Browser Python scaled samples
description: Scale sample values in the Browser Python runtime.
runtime: browser-python
code: scaled.py
inputs: {rows: source:raw/main}
query_inputs: {batch: batch}
compute_inputs: {factor: "dashboard:browser-python/factor"}
trigger: auto
debounce_ms: 0
export: {mode: interactive, assets: bundle}
outputs:
  main:
    kind: table
    description: Browser Python scaled sample rows
    schema: [{name: name}, {name: value}]
cache: {mode: none}
