schema: dataviz/dashboard/v20
kind: dashboard
id: cascade-explorer
title: 级联选择器
description: 对照 SQL、Workspace 文件 Adapter 与看板内置 CSV，验证三级 Selection 只在浏览器选择样本。
context:
  grain: 每个区县一行，记录所属省市及当前指标值
adapters:
  warehouse: demo-duckdb
  uploads: shared-files
controls:
  - id: province
    field: province
    type: multiple_select
    value_type: text
    label: 省份
    initial: {mode: values, values: [广东, 福建]}
    options:
      mode: static
      choices:
        - {label: 广东, value: 广东}
        - {label: 福建, value: 福建}
sources:
  - sources/cities.yaml
  - sources/uploaded.yaml
  - sources/bundled.yaml
views:
  - id: map-bars
    title: 区县值分布
    input: source:cities/main
    template: bar
    x: district
    y: val
    series: city
    aggregate: sum
    control_inputs:
      province: {mode: filter, control: dashboard.province, field: province, inputs: [main], empty: match_none}
      city: {mode: filter, control: section.city, field: city, inputs: [main], empty: match_none}

  - id: city-detail
    title: 级联后的城市明细
    input: source:cities/main
    template: table
    columns: [province, city, district, val]
    limit: 40
    controls:
      - id: min_value
        field: val
        type: single_input
        value_type: number
        label: 最低值
        default: 0
      - id: district
        type: multiple_select
        value_type: text
        label: 区县
        path_fields: [province, city, district]
        depends_on: [section.city]
        options: {mode: infer}
    control_inputs:
      province: {mode: filter, control: dashboard.province, field: province, inputs: [main], empty: match_none}
      city: {mode: filter, control: section.city, field: city, inputs: [main], empty: match_none}
      district: {mode: filter, control: view.district, field: [province, city, district], inputs: [main], empty: match_none}
      min_value: {mode: filter, control: view.min_value, field: val, inputs: [main], empty: passthrough, operator: gte}

  - id: uploaded-file
    title: Workspace Adapter 文件
    input: source:uploaded-file/main
    template: bar
    x: label
    y: val
    aggregate: sum

  - id: bundled-file
    title: 随看板分享的文件
    input: source:bundled-file/main
    template: table
    columns: [id, label, val]
    limit: 20

sections:
  - id: geography
    title: 地理级联
    controls:
      - id: city
        field: city
        type: multiple_select
        value_type: text
        label: 城市
        depends_on: [dashboard.province]
        options: {mode: infer}
    views: [map-bars, city-detail]
  - {id: files, title: 文件来源, views: [uploaded-file, bundled-file]}
canvas:
  template: canvas/template.html
  styles: [canvas/style.css]
  use_default_style: true
  client_libraries: [plotly]
