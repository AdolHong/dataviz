schema: dataviz/component-package/v1
package: selector.select
version: 1.1.0
category: selector
purpose: One flat single- or multi-select with search, grouping, tag summary and automatic virtualization.
implementation: {mode: package, sources: []}
dependencies: [runtime.selector]
components:
  - id: selector.select
    purpose: Keep one stable DSL from a short list through thousands of flat options.
    status: stable
    logic: {types: [single_select, multi_select], fields: [choices]}
    presentation:
      template: select
      options: [search, virtual, search_threshold, virtual_threshold, max_visible_tags, max_selected, hide_selected, placeholder, search_placeholder, select_all_label, invert_label, clear_label, show_unavailable, css_class]
    behavior: {canonical_state: native_select, search: full_list, virtual: automatic, option_groups: true, explicit_all: preserved, bulk_action: select_all_then_invert}
    semantic_dom: [.dv-select, .dv-choice-trigger, .dv-selector-panel, .dv-select-panel, .dv-select-options, .dv-select-group, .dv-choice-option]
    tokens: [--dv-accent, --dv-green, --dv-ink, --dv-line, --dv-panel, --dv-overlay-surface]
runtime: {controller: controller.js, adapter: adapter.js, style: style.css}
