schema: dataviz/dashboard/v9
kind: dashboard
id: chart-gallery
title: 多图表陈列室
description: 用同一份声明式数据契约展示 Plotly 图表模板、交互与统一主题。
context:
  grain: 每个城市、每个季度一行经营指标
adapters: {warehouse: demo-duckdb}
controls:
  - id: province
    kind: selection
    field: province
    type: multiple_select
    value_type: text
    label: 省份
    initial: {mode: values, values: [广东, 湖南, 福建, 浙江]}
    options:
      mode: static
      choices:
        - {label: 广东, value: 广东}
        - {label: 湖南, value: 湖南}
        - {label: 福建, value: 福建}
        - {label: 浙江, value: 浙江}
  - id: radar_city_count
    kind: compute
    type: single_input
    value_type: integer
    label: 雷达城市数
    default: 5
    min: 1
    max: 10
    step: 1
sources: [sources/metrics.yaml]
interactive_transforms: [transforms/latest-metrics.yaml]
views:
  - id: trend
    title: 季度收入轨迹
    input: source:metrics/main
    template: line
    x: quarter
    y: revenue
    series: province
    aggregate: sum

  - id: ranking
    title: 城市收入排行
    input: source:metrics/main
    template: bar
    x: city
    y: revenue
    aggregate: sum
    sort: revenue

  - id: composition
    title: 省份构成
    input: source:metrics/main
    template: pie
    label: province
    value: revenue
    aggregate: sum

  - id: scatter
    title: Plotly 区间探索
    description: 使用工具栏矩形或套索选择数据点；双击图表或点击恢复按钮回到默认选择。
    input: source:metrics/main
    template: scatter
    x: orders
    y: revenue
    series: province
    size: customers
    aggregate: none
    control_binding:
      control: dashboard.province
      field: province

  - id: radial
    title: 城市能力雷达
    input: interactive:latest-metrics/main
    template: radar
    label: city
    columns: [revenue, orders, customers]
    limit: 5

  - id: records
    title: 原始数据
    input: source:metrics/main
    template: table
    columns: [province, city, quarter, revenue, orders, customers]
    limit: 40
    options:
      searchable: true
      page_size: 5
      show_count: true
      align: {revenue: right, orders: right, customers: right}
      formats: {revenue: number, orders: number, customers: number}

sections:
  - {id: overview, title: 图形总览, views: [trend, ranking, composition]}
  - {id: details, title: 数据关系, views: [scatter, radial, records]}
canvas:
  template: canvas/template.html
  styles: [canvas/style.css]
  use_default_style: true
  client_libraries: [plotly]
