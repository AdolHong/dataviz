schema: dataviz/component-test/v1
tests:
  - id: control.range-picker.contract
    component: control.range-picker
    kind: contract
    assertions: [one-calendar-trigger, two-editable-ISO-endpoints, one-floating-dialog, start-then-end, canonical-pair-value, order-validation, bubbling-change]
  - id: control.range-picker.presets-and-empty-bounds
    component: control.range-picker
    kind: browser
    assertions: [preset-commits-both-bounds, clear-respects-value-contract, allow-empty-pair, escape-discards-draft, responsive-calendar]
