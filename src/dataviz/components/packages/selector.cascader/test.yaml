schema: dataviz/component-test/v1
tests:
  - id: selector.cascader.multi-branch
    component: selector.cascader
    kind: interaction
    assertions: [parent-context, multi-branch-selection, search-full-path, upstream-reconciliation, viewport-containment]
  - id: selector.cascader.keyboard
    component: selector.cascader
    kind: accessibility
    assertions: [tree-navigation, aria-selected, escape-closes, focus-returns]
  - id: selector.cascader.parent-descendants
    component: selector.cascader
    kind: browser
    assertions: [cascade-mode-selects-descendant-leaves, partial-branches-expose-mixed-state, checked-summary-strategy, upstream-change-removes-stale-paths]
