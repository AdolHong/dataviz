schema: dataviz/dashboard/v3
kind: dashboard
id: store-performance
title: 百店业绩巡检
subtitle: 一份 Dataset，两种重复视图阅读方式
description: 全量 Small Multiples 用于巡检；Selection Gallery 用于搜索并聚焦少量门店。

adapters:
  warehouse: demo-duckdb

sources:
  - id: store-sales
    name: 100 家门店的周度业绩
    type: sql
    adapter: warehouse
    code: sources/store-sales.sql
    outputs: {main: {kind: table}}

views:
  - id: all-store-trend
    title: 门店周度收入
    input: source:store-sales/main
    template: line
    engine: plotly
    x: week
    y: revenue
    aggregate: sum
    options:
      layout:
        showlegend: false

  - id: selected-store-trend
    title: 选中门店周度收入
    input: source:store-sales/main
    template: line
    engine: plotly
    x: week
    y: revenue
    aggregate: sum
    options:
      layout:
        showlegend: false

sections:
  - id: selected-stores
    title: 聚焦门店
    description: 支持搜索和区域 → 城市 → 门店级联多选；空选择时不创建图表。
    template: selection-gallery
    controls:
      - id: stores
        kind: selection
        label: 选择门店
        type: multi_select
        field: store_id
        path_fields: [region, city, store_id]
        default:
          - [华东, 上海, S001]
          - [华南, 深圳, S002]
    views: [selected-store-trend]
    repeat:
      view: selected-store-trend
      by: [store_id]
      selection: stores
      title: "{store_name} · {city}"
      render: lazy

  - id: all-stores
    title: 全部门店
    description: 100 个 View 实例共享一个 Source；只在接近视口时创建 Plotly 图表。
    template: small-multiples
    views: [all-store-trend]
    repeat:
      view: all-store-trend
      by: [store_id]
      title: "{store_name} · {city}"
      order_by: revenue
      order: desc
      limit: 100
      render: lazy
