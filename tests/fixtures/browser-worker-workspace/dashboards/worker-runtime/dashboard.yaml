schema: dataviz/dashboard/v3
kind: dashboard
id: worker-runtime
title: Browser JS Interactive Worker

controls:
  - id: delay_ms
    kind: compute
    label: Worker delay
    type: number
    default: 5

sources:
  - id: raw
    type: file
    path: data/rows.csv
    format: csv
    outputs: {main: {kind: table}}

interactive_transforms:
  - transforms/scaled.yaml

views:
  - id: scaled-table
    title: Scaled rows
    input: interactive:scaled/main
    template: table
    columns: [name, value]

sections:
  - id: results
    title: Results
    views: [scaled-table]
